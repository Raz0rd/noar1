<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Comprovantes - Ghost Pendentes</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .stat-card {
      background: #16213e;
      padding: 20px;
      border-radius: 12px;
      flex: 1;
      min-width: 200px;
      text-align: center;
      border: 1px solid #0f3460;
    }
    
    .stat-card h3 {
      font-size: 32px;
      color: #e94560;
      margin-bottom: 5px;
    }
    
    .stat-card p {
      color: #aaa;
      font-size: 14px;
    }
    
    .filters {
      background: #16213e;
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    
    .filters select, .filters input {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      font-size: 14px;
    }
    
    .filters button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    
    .filters button:hover {
      background: #d63050;
    }
    
    .receipts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }
    
    .receipt-card {
      background: #16213e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #0f3460;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .receipt-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
    }
    
    .receipt-card.resolved {
      opacity: 0.6;
      border-color: #2ecc71;
    }
    
    .receipt-image {
      width: 100%;
      height: 250px;
      object-fit: contain;
      background: #0f0f1a;
      cursor: pointer;
    }
    
    .receipt-info {
      padding: 15px;
    }
    
    .receipt-info h3 {
      font-size: 14px;
      color: #e94560;
      margin-bottom: 10px;
      word-break: break-all;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #0f3460;
      font-size: 13px;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .info-label {
      color: #888;
    }
    
    .info-value {
      font-weight: bold;
    }
    
    .info-value.paid {
      color: #2ecc71;
    }
    
    .info-value.pending {
      color: #f39c12;
    }
    
    .info-value.waiting {
      color: #e94560;
    }
    
    .customer-message {
      margin-top: 10px;
      padding: 10px;
      background: #0f0f1a;
      border-radius: 8px;
      font-size: 12px;
      color: #aaa;
      font-style: italic;
    }
    
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: opacity 0.2s;
    }
    
    .actions button:hover {
      opacity: 0.8;
    }
    
    .btn-resolve {
      background: #2ecc71;
      color: white;
    }
    
    .btn-copy {
      background: #3498db;
      color: white;
    }
    
    .btn-open {
      background: #9b59b6;
      color: white;
    }
    
    .loading {
      text-align: center;
      padding: 50px;
      color: #888;
    }
    
    .empty {
      text-align: center;
      padding: 50px;
      color: #888;
      background: #16213e;
      border-radius: 12px;
    }
    
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    .modal.active {
      display: flex;
    }
    
    .modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
    
    .modal-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
    }
    
    .config-section {
      background: #16213e;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    
    .config-section h3 {
      margin-bottom: 15px;
      color: #e94560;
    }
    
    .config-section input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #0f3460;
      background: #1a1a2e;
      color: #eee;
      margin-bottom: 10px;
    }
    
    .config-section button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #2ecc71;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    
    .hidden {
      display: none;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 25px;
      background: #2ecc71;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      transform: translateX(200%);
      transition: transform 0.3s;
      z-index: 1001;
    }
    
    .toast.show {
      transform: translateX(0);
    }
    
    .toast.error {
      background: #e94560;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Painel de Comprovantes</h1>
    <p>Comprovantes de pagamento recebidos via suporte - Para cobrar Ghost</p>
  </div>
  
  <!-- Conteúdo principal -->
  <div id="main-content">
    <div class="stats">
      <div class="stat-card">
        <h3 id="total-pending">0</h3>
        <p>Comprovantes Pendentes</p>
      </div>
      <div class="stat-card">
        <h3 id="total-value">R$ 0</h3>
        <p>Valor Total Pendente</p>
      </div>
      <div class="stat-card">
        <h3 id="total-resolved">0</h3>
        <p>Resolvidos Hoje</p>
      </div>
    </div>
    
    <div class="filters">
      <select id="filter-status">
        <option value="pending">Apenas Pendentes</option>
        <option value="resolved">Apenas Resolvidos</option>
        <option value="all">Todos</option>
      </select>
      <select id="filter-ghost">
        <option value="all">Todos Status Ghost</option>
        <option value="waiting_payment">Waiting Payment</option>
        <option value="paid">Paid</option>
        <option value="expired">Expired</option>
      </select>
      <input type="date" id="filter-date" placeholder="Data">
      <button onclick="loadReceipts()">🔄 Atualizar</button>
      <button onclick="exportCSV()" style="background: #3498db;">📊 Exportar CSV</button>
      <button onclick="deleteAll()" style="background: #c0392b;">🗑️ Apagar Todos</button>
    </div>
    
    <div id="receipts-container" class="receipts-grid">
      <div class="loading">Carregando comprovantes...</div>
    </div>
  </div>
  
  <!-- Modal para imagem ampliada -->
  <div id="image-modal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <img id="modal-image" src="" alt="Comprovante">
  </div>
  
  <!-- Toast de notificação -->
  <div id="toast" class="toast"></div>
  
  <script>
    // Credenciais hardcoded (uso local apenas)
    const SUPABASE_URL = 'https://irfbwvfnmhcbxlxrthxs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyZmJ3dmZubWhjYnhseHJ0aHhzIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1NzY0NTQxMSwiZXhwIjoyMDczMjIxNDExfQ.DYbzFgIEL6UEuOFr3KjShIDzvYlqtfFsO3Ytn0Obv30';
    
    let supabaseClient = null;
    let receiptsData = [];
    
    // Inicializar automaticamente
    function checkSavedConfig() {
      initSupabase();
    }
    
    // Inicializar Supabase
    async function initSupabase() {
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Testar conexão
        const { data, error } = await supabaseClient
          .from('payment_receipts')
          .select('id')
          .limit(1);
        
        if (error) throw error;
        
        showToast('Conectado ao Supabase!');
        loadReceipts();
      } catch (error) {
        console.error('Erro ao conectar:', error);
        showToast('Erro ao conectar: ' + error.message, true);
      }
    }
    
    // Carregar comprovantes
    async function loadReceipts() {
      const container = document.getElementById('receipts-container');
      container.innerHTML = '<div class="loading">Carregando...</div>';
      
      console.log('📥 Iniciando carregamento...');
      
      try {
        const filterStatus = document.getElementById('filter-status').value;
        const filterGhost = document.getElementById('filter-ghost').value;
        const filterDate = document.getElementById('filter-date').value;
        
        console.log('🔍 Filtros:', { filterStatus, filterGhost, filterDate });
        
        const { data, error } = await supabaseClient
          .from('payment_receipts')
          .select('*')
          .order('created_at', { ascending: false });
        
        console.log('📊 Resultado:', { data, error });
        
        if (error) throw error;
        
        // Aplicar filtros no cliente
        let filteredData = data || [];
        
        if (filterStatus === 'pending') {
          filteredData = filteredData.filter(r => !r.resolved);
        } else if (filterStatus === 'resolved') {
          filteredData = filteredData.filter(r => r.resolved);
        }
        
        if (filterGhost !== 'all') {
          filteredData = filteredData.filter(r => r.ghost_status === filterGhost);
        }
        
        receiptsData = filteredData;
        console.log('✅ Dados filtrados:', receiptsData.length);
        
        renderReceipts(receiptsData);
        updateStats(receiptsData);
        
      } catch (error) {
        console.error('❌ Erro ao carregar:', error);
        container.innerHTML = '<div class="empty">Erro ao carregar: ' + error.message + '</div>';
        showToast('Erro: ' + error.message, true);
      }
    }
    
    // Renderizar comprovantes
    function renderReceipts(data) {
      const container = document.getElementById('receipts-container');
      
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty">Nenhum comprovante encontrado</div>';
        return;
      }
      
      container.innerHTML = data.map(receipt => `
        <div class="receipt-card ${receipt.resolved ? 'resolved' : ''}">
          ${receipt.receipt_url ? `
            <img 
              src="${receipt.receipt_url}" 
              class="receipt-image" 
              alt="Comprovante"
              onclick="openModal('${receipt.receipt_url}')"
              onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>'"
            >
          ` : `
            <div class="receipt-image" style="display:flex;align-items:center;justify-content:center;font-size:48px;">📄</div>
          `}
          <div class="receipt-info">
            <h3>🔑 ${receipt.payment_id}</h3>
            <div class="info-row">
              <span class="info-label">Status Ghost:</span>
              <span class="info-value ${getStatusClass(receipt.ghost_status)}">${receipt.ghost_status || 'N/A'}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Valor:</span>
              <span class="info-value">R$ ${((receipt.amount || 0) / 100).toFixed(2)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Data:</span>
              <span class="info-value">${formatDate(receipt.created_at)}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Status:</span>
              <span class="info-value ${receipt.resolved ? 'paid' : 'waiting'}">${receipt.resolved ? '✅ Resolvido' : '⏳ Pendente'}</span>
            </div>
            ${receipt.customer_message ? `
              <div class="customer-message">
                💬 "${receipt.customer_message}"
              </div>
            ` : ''}
            <div class="actions">
              <button class="btn-copy" onclick="copyPaymentId('${receipt.payment_id}')">📋 Copiar ID</button>
              ${receipt.receipt_url ? `
                <button class="btn-open" onclick="window.open('${receipt.receipt_url}', '_blank')">🖼️ Abrir</button>
              ` : ''}
              ${!receipt.resolved ? `
                <button class="btn-resolve" onclick="markResolved('${receipt.id}')">✅ Resolver</button>
              ` : ''}
              <button style="background:#c0392b;color:white;" onclick="deleteOne('${receipt.id}')">🗑️</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    // Atualizar estatísticas
    function updateStats(data) {
      const pending = data.filter(r => !r.resolved);
      const resolvedToday = data.filter(r => {
        if (!r.resolved) return false;
        const today = new Date().toDateString();
        const receiptDate = new Date(r.created_at).toDateString();
        return today === receiptDate;
      });
      
      const totalValue = pending.reduce((sum, r) => sum + (r.amount || 0), 0);
      
      document.getElementById('total-pending').textContent = pending.length;
      document.getElementById('total-value').textContent = `R$ ${(totalValue / 100).toFixed(2)}`;
      document.getElementById('total-resolved').textContent = resolvedToday.length;
    }
    
    // Marcar como resolvido
    async function markResolved(id) {
      if (!confirm('Marcar este comprovante como resolvido?')) return;
      
      try {
        const { error } = await supabaseClient
          .from('payment_receipts')
          .update({ resolved: true, resolved_at: new Date().toISOString() })
          .eq('id', id);
        
        if (error) throw error;
        
        showToast('Marcado como resolvido!');
        loadReceipts();
      } catch (error) {
        showToast('Erro: ' + error.message, true);
      }
    }
    
    // Copiar ID do pagamento
    function copyPaymentId(id) {
      navigator.clipboard.writeText(id);
      showToast('ID copiado!');
    }
    
    // Apagar um comprovante
    async function deleteOne(id) {
      if (!confirm('Tem certeza que deseja APAGAR este comprovante?')) return;
      
      try {
        const { error } = await supabaseClient
          .from('payment_receipts')
          .delete()
          .eq('id', id);
        
        if (error) throw error;
        
        showToast('Comprovante apagado!');
        loadReceipts();
      } catch (error) {
        showToast('Erro: ' + error.message, true);
      }
    }
    
    // Apagar todos os comprovantes
    async function deleteAll() {
      const count = receiptsData.length;
      if (!confirm(`Tem certeza que deseja APAGAR TODOS os ${count} comprovantes? Esta ação não pode ser desfeita!`)) return;
      if (!confirm('CONFIRMAÇÃO FINAL: Todos os dados serão perdidos permanentemente. Continuar?')) return;
      
      try {
        const { error } = await supabaseClient
          .from('payment_receipts')
          .delete()
          .neq('id', '00000000-0000-0000-0000-000000000000'); // Hack para deletar todos
        
        if (error) throw error;
        
        showToast('Todos os comprovantes foram apagados!');
        loadReceipts();
      } catch (error) {
        showToast('Erro: ' + error.message, true);
      }
    }
    
    // Abrir modal com imagem
    function openModal(url) {
      document.getElementById('modal-image').src = url;
      document.getElementById('image-modal').classList.add('active');
    }
    
    // Fechar modal
    function closeModal() {
      document.getElementById('image-modal').classList.remove('active');
    }
    
    // Exportar para CSV
    function exportCSV() {
      if (!receiptsData.length) {
        showToast('Nenhum dado para exportar', true);
        return;
      }
      
      const headers = ['ID Pagamento', 'Status Ghost', 'Valor', 'Data', 'Resolvido', 'Mensagem'];
      const rows = receiptsData.map(r => [
        r.payment_id,
        r.ghost_status,
        ((r.amount || 0) / 100).toFixed(2),
        formatDate(r.created_at),
        r.resolved ? 'Sim' : 'Não',
        r.customer_message || ''
      ]);
      
      const csv = [headers.join(','), ...rows.map(r => r.map(c => `"${c}"`).join(','))].join('\n');
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `comprovantes_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
      
      showToast('CSV exportado!');
    }
    
    // Helpers
    function getStatusClass(status) {
      if (!status) return '';
      status = status.toLowerCase();
      if (status === 'paid') return 'paid';
      if (status === 'waiting_payment') return 'waiting';
      return 'pending';
    }
    
    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      const date = new Date(dateStr);
      return date.toLocaleString('pt-BR');
    }
    
    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Tecla ESC para fechar modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
    
    // Inicializar
    checkSavedConfig();
  </script>
</body>
</html>
